<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emater Finder</title>
<style>
html,body{margin:0;min-height:100%;background:#05070b;color:#dfe9f7;font-family:Segoe UI,Arial,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center}
#boot div{font-size:13px;color:#718096;letter-spacing:.02em}
</style>
</head>
<body>
<div id="boot"><div>Loading Emater Finder…</div></div>
<script>
(async()=>{
  try{
    const parts=await Promise.all([1,2,3,4,5].map(i=>fetch('./site/part'+i+'.b64?v=20260924').then(r=>{
      if(!r.ok) throw new Error('part '+i);
      return r.text();
    })));
    const raw=atob(parts.join('').replace(/\s+/g,''));
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div>Could not load Emater Finder.</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
